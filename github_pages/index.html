<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗別売上・GA4アクセス分析ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 10px 0;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto 30px auto;
        }

        .kpi-card {
            background-color: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
            transition: transform 0.2s;
        }
        
        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-title {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }
        
        .kpi-sub {
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 1s ease-out;
        }

        .card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            color: #e2e8f0;
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-weight: 600;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        td:first-child, th:first-child {
            text-align: left;
        }
        
        tbody tr:hover {
            background-color: var(--surface-hover);
        }

        .positive { color: var(--secondary); font-weight: bold; }
        .negative { color: var(--danger); font-weight: bold; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

            </div>
            <div class="chart-container">

            </div>
        </div>

                    </thead>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
                initDashboard();
            }, 800);
        });

        // Chart Defaults
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 23, 42, 0.9)';
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.titleColor = '#fff';

        function initDashboard() {
            if (typeof dashboardData2 === 'undefined') {
                alert('データが見つかりません。');
                return;
            }

            renderKPIs();
            renderSalesChart();
            renderGA4Chart();
            renderCustomerTopChart();
            renderCustomerBottomChart();
            renderMotivationChart();
            renderDiscountGrowthChart();
            renderCustomerCorrelationChart();
            renderCorrelationChart();
            renderDataTable();
        }

        function calculateKPIs() {
            const d = dashboardData2.merged_store_data;
            let totalSales4 = 0, totalSales5 = 0;
            let totalUU4 = 0, totalUU5 = 0;
            let totalCust4 = 0, totalCust5 = 0;
            
            d.forEach(store => {
                if(store.sales_4) {
                    totalSales4 += store.sales_4['売上金額'] || 0;
                    totalCust4 += store.sales_4['顧客数（ユニーク）'] || 0;
                }
                if(store.sales_5) {
                    totalSales5 += store.sales_5['売上金額'] || 0;
                    totalCust5 += store.sales_5['顧客数（ユニーク）'] || 0;
                }
                if(store.ga4) {
                    totalUU4 += store.ga4['4月 UU数'] || 0;
                    totalUU5 += store.ga4['5月 UU数'] || 0;
                }
            });

            const salesGrowth = totalSales4 ? ((totalSales5 - totalSales4) / totalSales4) * 100 : 0;
            const uuGrowth = totalUU4 ? ((totalUU5 - totalUU4) / totalUU4) * 100 : 0;
            const custGrowth = totalCust4 ? ((totalCust5 - totalCust4) / totalCust4) * 100 : 0;
            
            return {
                sales4: totalSales4, sales5: totalSales5, salesGrowth,
                uu4: totalUU4, uu5: totalUU5, uuGrowth,
                cust4: totalCust4, cust5: totalCust5, custGrowth
            };
        }

        function formatCurrency(val) {
            if(val >= 1000000) return '¥' + (val / 1000000).toFixed(1) + 'M';
            if(val >= 10000) return '¥' + (val / 10000).toFixed(1) + '万';
            return '¥' + val.toLocaleString();
        }

        function renderKPIs() {
            const kpi = calculateKPIs();
            const container = document.getElementById('kpiContainer');
            
            const salesClass = kpi.salesGrowth >= 0 ? 'positive' : 'negative';
            const uuClass = kpi.uuGrowth >= 0 ? 'positive' : 'negative';
            const custClass = kpi.custGrowth >= 0 ? 'positive' : 'negative';

            container.innerHTML = `
                <div class="kpi-card">
                    <div class="kpi-title">5月 総売上金額</div>
                    <div class="kpi-value">${formatCurrency(kpi.sales5)}</div>
                    <div class="kpi-sub ${salesClass}">前月比 ${kpi.salesGrowth >= 0 ? '+' : ''}${kpi.salesGrowth.toFixed(1)}%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">5月 総顧客数</div>
                    <div class="kpi-value">${kpi.cust5.toLocaleString()} 人</div>
                    <div class="kpi-sub ${custClass}">前月比 ${kpi.custGrowth >= 0 ? '+' : ''}${kpi.custGrowth.toFixed(1)}%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">5月 総GA4 UU数</div>
                    <div class="kpi-value">${kpi.uu5.toLocaleString()} UU</div>
                    <div class="kpi-sub ${uuClass}">前月比 ${kpi.uuGrowth >= 0 ? '+' : ''}${kpi.uuGrowth.toFixed(1)}%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">5月 平均UU単価 (売上/UU)</div>
                    <div class="kpi-value">¥${kpi.uu5 ? Math.round(kpi.sales5 / kpi.uu5).toLocaleString() : 0}</div>
                    <div class="kpi-sub">UUあたりの売上効率</div>
                </div>
            `;
        }

        function renderSalesChart() {
            const data = dashboardData2.merged_store_data.filter(s => s.sales_4 && s.sales_5 && s.sales_4['店舗名'] !== 'DV店');
            data.sort((a, b) => b.sales_4['売上金額'] - a.sales_4['売上金額']);
            const plotData = data.slice(0, 15);

            const ctx = document.getElementById('salesChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: plotData.map(d => d.sales_4['店舗名']),
                    datasets: [
                        {
                            label: '4月 売上金額',
                            data: plotData.map(d => d.sales_4['売上金額']),
                            backgroundColor: 'rgba(148, 163, 184, 0.6)',
                            borderRadius: 4

                        {
                            label: '5月 売上金額',
                            data: plotData.map(d => d.sales_5['売上金額']),
                            backgroundColor: 'rgba(59, 130, 246, 0.8)',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { callback: function(value) { return '¥' + (value/10000).toFixed(0) + '万'; } }
                        },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

                    }

        function renderDiscountGrowthChart() {
            const d4 = dashboardData2.discount_4 || [];
            const d5 = dashboardData2.discount_5 || [];
            
            const storeCounts4 = {};
            const storeCounts5 = {};
            
            d4.forEach(r => {
                if(r['店舗名'] && r['店舗名'] !== '合計') {
                    storeCounts4[r['店舗名']] = (storeCounts4[r['店舗名']] || 0) + (r['件数'] || 0);
                }
            });
            d5.forEach(r => {
                if(r['店舗名'] && r['店舗名'] !== '合計') {
                    storeCounts5[r['店舗名']] = (storeCounts5[r['店舗名']] || 0) + (r['件数'] || 0);
                }
            });
            
            const growthRates = [];
            for(const store in storeCounts4) {
                const count4 = storeCounts4[store];
                const count5 = storeCounts5[store] || 0;
                if(count4 > 0) {
                    const growth = ((count5 - count4) / count4) * 100;
                    growthRates.push({ store, growth, count4, count5 });
                }
            }
            
            growthRates.sort((a, b) => b.growth - a.growth);
            const plotData = growthRates.slice(0, 15);

            const ctx = document.getElementById('discountGrowthChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: plotData.map(d => d.store),
                    datasets: [{
                        label: '値割引件数増加率 (%)',
                        data: plotData.map(d => d.growth.toFixed(1)),
                        backgroundColor: plotData.map(d => d.growth >= 0 ? 'rgba(236, 72, 153, 0.8)' : 'rgba(239, 68, 68, 0.8)'),
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const d = plotData[ctx.dataIndex];
                                    return `増加率: ${d.growth.toFixed(1)}% (4月: ${d.count4}件 → 5月: ${d.count5}件)`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: { 
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { callback: function(value) { return value + "%" } }
                        },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

                    }
                }
            });
        }

        function renderCustomerCorrelationChart() {
            const data = dashboardData2.merged_store_data.filter(s => s.sales_5 && s.ga4);
            
            const scatterData = data.map(store => {
                const customers = store.sales_5['顧客数（ユニーク）'];
                const uu = store.ga4['5月 UU数'];

                if(customers !== null && customers !== undefined && uu !== null && uu !== undefined) {
                    return { x: uu, y: customers, store: store.sales_5['店舗名'] };
                }
                return null;
            }).filter(d => d !== null && d.store !== 'JL店');

            const ctx = document.getElementById('customerCorrelationChart').getContext('2d');
            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: '店舗',
                        data: scatterData,
                        backgroundColor: '#10b981',
                        pointRadius: 5,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const d = ctx.raw;
                                    return `${d.store}: UU ${d.x.toLocaleString()}, 顧客数 ${d.y.toLocaleString()}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            title: { display: true, text: 'GA4 UU数', color: '#e2e8f0' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: { 
                            title: { display: true, text: '顧客数（ユニーク）', color: '#e2e8f0' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        }
                    }
                }
            });
        }

        function renderCorrelationChart() {
            const data = dashboardData2.merged_store_data.filter(s => s.sales_4 && s.sales_5 && s.ga4);
            
            const scatterData = data.map(store => {
                const s4 = store.sales_4['売上金額'];
                const s5 = store.sales_5['売上金額'];
                const u4 = store.ga4['4月 UU数'];
                const u5 = store.ga4['5月 UU数'];

                if(s4 && u4) {
                    const salesGrowth = ((s5 - s4) / s4) * 100;
                    const uuGrowth = ((u5 - u4) / u4) * 100;
                    return { x: uuGrowth, y: salesGrowth, store: store.sales_4['店舗名'] };
                }
                return null;
            }).filter(d => d !== null && d.x > -100 && d.x < 500 && d.y > -100 && d.y < 500); // Filter out extreme outliers for better scale

            const ctx = document.getElementById('correlationChart').getContext('2d');
            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: '店舗',
                        data: scatterData,
                        backgroundColor: '#f59e0b',
                        pointRadius: 5,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const d = ctx.raw;
                                    return `${d.store}: UU ${d.x.toFixed(1)}%, 売上 ${d.y.toFixed(1)}%`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            title: { display: true, text: 'UU数 増減率 (%)', color: '#e2e8f0' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: { 
                            title: { display: true, text: '売上金額 増減率 (%)', color: '#e2e8f0' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        }
                    }
                }
            });
        }

        function renderDataTable() {
            const data = dashboardData2.merged_store_data;
            const tbody = document.querySelector('#dataTable tbody');
            let html = '';

            const formatNum = num => num ? Number(num).toLocaleString() : '-';
            const formatPct = pct => {
                if (pct === null || pct === undefined || isNaN(pct)) return '-';
                const val = pct.toFixed(1);
                const cls = val > 0 ? 'positive' : (val < 0 ? 'negative' : '');
                return `<span class="${cls}">${val > 0 ? '+' : ''}${val}%</span>`;
            };

            data.forEach(s => {
                if (!s.sales_4 || s.sales_4['店舗名'] === '合計' || s.sales_4['店舗名'] === 'DV店') return;

                const name = s.sales_4['店舗名'];
                const s4 = s.sales_4['売上金額'] || 0;
                const s5 = s.sales_5 ? (s.sales_5['売上金額'] || 0) : 0;
                const c4 = s.sales_4['顧客数（ユニーク）'] || 0;
                const c5 = s.sales_5 ? (s.sales_5['顧客数（ユニーク）'] || 0) : 0;
                const m4 = s.sales_4['粗利率(%)'];
                const m5 = s.sales_5 ? s.sales_5['粗利率(%)'] : null;
                
                const s_growth = s4 ? ((s5 - s4) / s4) * 100 : null;
                const c_growth = c4 ? ((c5 - c4) / c4) * 100 : null;

                let u4 = 0, u5 = 0, u_growth = null;
                if(s.ga4) {
                    u4 = s.ga4['4月 UU数'] || 0;
                    u5 = s.ga4['5月 UU数'] || 0;
                    if(u4) u_growth = ((u5 - u4) / u4) * 100;
                }
                
                html += `
                    <tr>
                        <td><strong>${name}</strong></td>
                        <td>¥${formatNum(s4)}</td>
                        <td>¥${formatNum(s5)}</td>
                        <td>${formatPct(s_growth)}</td>
                        <td>${formatNum(c4)}</td>
                        <td>${formatNum(c5)}</td>
                        <td>${formatPct(c_growth)}</td>
                        <td>${m4 ? m4 + '%' : '-'}</td>
                        <td>${m5 ? m5 + '%' : '-'}</td>
                        <td>${formatNum(u4)}</td>
                        <td>${formatNum(u5)}</td>
                        <td>${formatPct(u_growth)}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
